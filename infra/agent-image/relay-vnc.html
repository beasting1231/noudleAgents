<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>noudleAgents Computer</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #screen { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0d10; }
      #screen { display: flex; }
      #screen canvas { margin: auto; outline: 0; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; color: #737a84; background: #0b0d10; font: 500 12px system-ui, sans-serif; letter-spacing: .02em; transition: opacity 180ms ease; }
      #status.is-hidden { opacity: 0; pointer-events: none; }
    </style>
    <script type="module">
      import RFB from "./core/rfb.js";

      const query = new URLSearchParams(window.location.search);
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const path = query.get("path") || "websockify";
      const socketUrl = `${protocol}://${window.location.host}/${path}`;
      const status = document.querySelector("#status");
      const rfb = new RFB(document.querySelector("#screen"), socketUrl);

      rfb.scaleViewport = true;
      rfb.resizeSession = false;
      rfb.viewOnly = false;
      rfb.focusOnClick = true;

      window.addEventListener("paste", (event) => {
        const text = event.clipboardData?.getData("text/plain");
        if (!text) return;
        event.preventDefault();
        rfb.clipboardPasteFrom(text);
      }, true);

      rfb.addEventListener("clipboard", async (event) => {
        const text = event.detail?.text;
        if (!text || !navigator.clipboard?.writeText) return;
        await navigator.clipboard.writeText(text).catch(() => undefined);
      });

      rfb.addEventListener("connect", () => status.classList.add("is-hidden"));
      rfb.addEventListener("disconnect", (event) => {
        status.textContent = event.detail.clean ? "Computer disconnected" : "Reconnecting computer…";
        status.classList.remove("is-hidden");
        if (!event.detail.clean) window.setTimeout(() => window.location.reload(), 900);
      });
    </script>
  </head>
  <body>
    <div id="screen"></div>
    <div id="status" role="status">Connecting computer…</div>
  </body>
</html>
